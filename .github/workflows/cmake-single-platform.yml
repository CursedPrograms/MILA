# Builds the C++ desktop controller (scripts/mila_controller.cpp). It is a native
# Win32 app, so it needs a Windows runner; MinGW is the toolchain it is developed with.
name: Build C++ controller

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # CMakeLists.txt lives in scripts/, not the repo root.
      run: cmake -S scripts -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build build

    - name: Upload the executable
      uses: actions/upload-artifact@v4
      with:
        name: mila_controller
        path: build/mila_controller.exe
